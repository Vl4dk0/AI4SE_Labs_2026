[project]
name = "task3-rcaf1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["ruff>=0.9", "pyright>=1.1.390", "scipy-stubs>=1.14"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
