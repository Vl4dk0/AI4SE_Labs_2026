[project]
name = "task4-analysis"
version = "0.1.0"
description = "Statistical comparison of prompting frameworks x coding-agent solvers on text-to-SQL"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14.4",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.390",
    "pandas-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[project.scripts]
task4-analysis = "analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]
