[project]
name = "requirements-network"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["Task_1/tests"]
pythonpath = ["Task_1"]
